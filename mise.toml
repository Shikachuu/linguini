[tools]
uv = "0.13"
node = "24"
pnpm = "12"
cloudflared = "2026"
"github:DeusData/codebase-memory-mcp" = "0.11.0"

[hooks]
postinstall = "mise run bootstrap"

[tasks.bootstrap]
description = "Install dependencies and index repo"
run = [
  "uv sync --all-extras",
  "pnpm -C web install --frozen-lockfile",
  "codebase-memory-mcp cli index_repository --repo-path {{ config_root }}",
]

[tasks.check]
description = "Lint, format check, type check, and test the API and web app, and check generated code is current"
run = [
  "uv run ruff check .",
  "uv run ruff format --check .",
  "uv run ty check",
  "uv run pytest",
  "pnpm -C web exec vp check",
  "pnpm -C web exec vp test",
  { task = "gen" },
  "git diff --exit-code -- web/openapi.json web/src/api/gen && test -z \"$(git status --porcelain -- web/openapi.json web/src/api/gen)\"",
]

[tasks.fmt]
description = "Format and autofix lint findings in the API and web app"
run = [
  "uv run ruff check --fix .",
  "uv run ruff format .",
  "pnpm -C web exec vp check --fix",
]

[tasks.test]
description = "Run the API and web test suites"
run = ["uv run pytest", "pnpm -C web exec vp test"]

[tasks.build]
description = "Build the web app into web/dist"
run = "pnpm -C web exec vp build"

[tasks.gen]
description = "Regenerate web/openapi.json and the typed API client"
run = [
  "uv run python -c 'import json; from pydantic import SecretStr; from linguini.app import create_app; from linguini.config import Settings; print(json.dumps(create_app(Settings(secret_key=SecretStr(\"openapi\"))).openapi(), indent=2))' > web/openapi.json",
  "pnpm -C web exec orval",
]

[tasks.dev]
description = "Serve the API and the continuously rebuilt web app on http://127.0.0.1:8000"
env = { _.file = ".env", LINGUINI_STATIC_DIR = "{{config_root}}/web/dist" }
shell = "bash -c"
run = """
set -euo pipefail
trap 'kill $(jobs -p) 2>/dev/null' EXIT
pnpm -C web exec vp build
pnpm -C web exec vp build --watch &
if [[ -n "${LINGUINI_DEV_TUNNEL:-}" ]]; then
  cloudflared tunnel run --url http://127.0.0.1:8000 "$LINGUINI_DEV_TUNNEL" &
fi
uv run fastapi dev --entrypoint linguini.main:app
"""

[tasks.eval]
description = "Run the prompt evals against the model configured in .env (real, billed model calls)"
env = { _.file = ".env" }
run = "uv run python -m evals"

[tasks.e2e]
description = "Build the web app and run the browser end-to-end tests"
run = [
  "pnpm -C web exec vp build",
  "uv run playwright install chromium",
  "uv run pytest tests/e2e --tracing retain-on-failure --output test-results",
]

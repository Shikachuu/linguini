name: Set up toolchain
description: Install mise tools, Python dependencies, and web dependencies with caches
runs:
  using: composite
  steps:
    - name: Install mise tools
      uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      with:
        install_args: --locked
    - name: Cache uv
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
        restore-keys: ${{ runner.os }}-uv-
    - name: Install Python dependencies
      shell: bash
      run: uv sync --locked
      env:
        UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/uv-python
    - name: Locate pnpm store
      id: pnpm
      shell: bash
      run: echo "store=$(pnpm -C web store path)" >> "$GITHUB_OUTPUT"
    - name: Cache pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm.outputs.store }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('web/pnpm-lock.yaml') }}
        restore-keys: ${{ runner.os }}-pnpm-
    - name: Install web dependencies
      shell: bash
      run: pnpm -C web install --frozen-lockfile

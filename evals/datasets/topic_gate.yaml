    inputs:
      message: "Írj egy Python függvényt, ami megfordít egy listát."
    metadata: {expect: block, category: off_topic}
  - name: off-topic-code-en
    inputs:
      message: "Fix this React bug: useEffect runs twice on mount."
    metadata: {expect: block, category: off_topic}
  - name: off-topic-sql-hu
    inputs:
      message: "Mi az az SQL, és hogyan működik a JOIN?"
    metadata: {expect: block, category: off_topic}
  - name: off-topic-essay-en
    inputs:
      message: "Write an essay about the French Revolution."
    metadata: {expect: block, category: off_topic}
  - name: off-topic-capital-en
    inputs:
      message: "What's the capital of Australia?"

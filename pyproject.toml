[project]
name = "linguini"
version = "0.1.0"
description = "Self-hosted, food-focused household AI chat with pantry inventory and Kifli integration"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "fastapi>=0.141",
    "fastapi-cli>=0.0.11",
    "pydantic-settings>=2.10",
    "pydantic-ai-slim[openai,mcp,ui,spec]>=2.59,<3",
    "sqlmodel>=0.0.48,<0.1",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.22",
    "alembic>=1.16",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
    "ruff>=0.14",
    "ty",
    "dirty-equals>=0.9",
    "respx>=0.22",
    "fastmcp>=4.1.3",
    "pytest-playwright>=0.10.0",
    "pydantic-ai-slim[evals]>=2.59,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linguini"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py314"

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.ruff.lint]
fixable = ["ALL"]
preview = true
ignore = ["incorrect-blank-line-before-class", "multi-line-summary-second-line"]
select = [
    "E",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
    "FAST",
    "RUF",
    "DOC",
    "D",
    "Q",
    "DTZ",
    "ICN",
    "N",
    "PERF",
    "ANN",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "DOC", "ANN"]
"evals/**" = ["D", "DOC", "ANN"]
"src/linguini/migrations/versions/**" = ["D", "DOC"]
"src/linguini/**/router.py" = ["docstring-missing-returns", "fast-api-unused-path-parameter"]
"src/linguini/chat/tools.py" = ["undocumented-param"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
norecursedirs = ["e2e"]

[tool.ty.environment]
python-version = "3.14"
